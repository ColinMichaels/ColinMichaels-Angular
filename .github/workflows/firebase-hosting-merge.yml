name: Deploy Firebase Hosting production on master PR merge

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  checks: write
  contents: read

jobs:
  detect_changes:
    if: ${{ github.event.pull_request.merged == true && github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    outputs:
      hosting_changed: ${{ steps.scope.outputs.hosting_changed }}
      functions_changed: ${{ steps.scope.outputs.functions_changed }}
      seo_template_changed: ${{ steps.scope.outputs.seo_template_changed }}
      functions_deploy_needed: ${{ steps.scope.outputs.functions_deploy_needed }}
      rules_changed: ${{ steps.scope.outputs.rules_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Detect Firebase deploy scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: .github/scripts/detect-firebase-deploy-scope.sh

  validate_production_environment:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.hosting_changed == 'true' || needs.detect_changes.outputs.functions_deploy_needed == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_TITLE: ${{ vars.APP_TITLE || secrets.APP_TITLE }}
      APP_API_URL: ${{ vars.APP_API_URL || vars.API_URL || secrets.APP_API_URL || secrets.API_URL }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL || secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Validate required environment variables
        run: |
          missing=()
          required=(
            APP_TITLE
            APP_API_URL
            FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN
            FIREBASE_DATABASE_URL
            FIREBASE_PROJECT_ID
            FIREBASE_STORAGE_BUCKET
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_APP_ID
            FIREBASE_MEASUREMENT_ID
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required workflow environment variables:"
            printf -- '- %s\n' "${missing[@]}"
            echo "Check GitHub repository/environment Variables and Secrets configuration."
            exit 1
          fi

  build_hosting:
    needs:
      - detect_changes
      - validate_production_environment
    if: ${{ needs.detect_changes.outputs.hosting_changed == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_TITLE: ${{ vars.APP_TITLE || secrets.APP_TITLE }}
      APP_API_URL: ${{ vars.APP_API_URL || vars.API_URL || secrets.APP_API_URL || secrets.API_URL }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL || secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Angular environment files
        run: npm run generate:env

      - name: Build Angular app
        run: npm run build

      - name: Upload Hosting build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-hosting-production
          path: dist/colin-michaels-firebase/browser
          if-no-files-found: error
          retention-days: 1

  build_functions:
    needs:
      - detect_changes
      - validate_production_environment
      - build_hosting
    if: ${{ always() && needs.detect_changes.outputs.functions_deploy_needed == 'true' && needs.validate_production_environment.result == 'success' && (needs.build_hosting.result == 'success' || needs.build_hosting.result == 'skipped') && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_TITLE: ${{ vars.APP_TITLE || secrets.APP_TITLE }}
      APP_API_URL: ${{ vars.APP_API_URL || vars.API_URL || secrets.APP_API_URL || secrets.API_URL }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL || secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Download Hosting build artifact for SEO template
        if: ${{ needs.detect_changes.outputs.hosting_changed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: firebase-hosting-production
          path: dist/colin-michaels-firebase/browser

      - name: Build Angular app for SEO template
        if: ${{ needs.detect_changes.outputs.hosting_changed != 'true' }}
        run: |
          npm ci
          npm run generate:env
          npm run build

      - name: Prepare SEO HTML template for Functions
        run: npm run prepare:functions-seo

      - name: Build Firebase Functions
        run: npm --prefix functions run build

      - name: Upload Functions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-functions-production
          path: |
            functions/lib
            functions/seo-index.html
          if-no-files-found: error
          retention-days: 1

  deploy_functions:
    needs:
      - detect_changes
      - build_functions
    if: ${{ needs.detect_changes.outputs.functions_deploy_needed == 'true' && needs.build_functions.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || 'colinmichaels' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Download Functions build artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-functions-production
          path: functions

      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLINMICHAELS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/validate-firebase-service-account.mjs

      - name: Create Firebase ADC credentials file
        id: firebase-auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLINMICHAELS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/write-firebase-service-account.mjs

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Create Firebase Functions deploy config
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (config.functions) {
            delete config.functions.predeploy;
          }
          fs.writeFileSync('firebase.ci.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase-auth.outputs.credentials_file_path }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.firebase-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail

          export CLOUDSDK_CORE_PROJECT="$FIREBASE_PROJECT_ID"
          export GOOGLE_CLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GCLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GCP_PROJECT="$FIREBASE_PROJECT_ID"
          export CLOUDSDK_CONFIG="${RUNNER_TEMP:-/tmp}/gcloud"
          mkdir -p "$CLOUDSDK_CONFIG"

          gcloud auth activate-service-account \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" \
            --project="$FIREBASE_PROJECT_ID"
          gcloud config set project "$FIREBASE_PROJECT_ID"

          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          if [ -z "$active_account" ]; then
            echo "gcloud did not activate a service account." >&2
            exit 1
          fi

          echo "gcloud active account: $active_account"
          gcloud auth print-access-token >/dev/null

          env -u FIREBASE_TOKEN npx --yes firebase-tools@14 deploy \
            --only functions \
            --config firebase.ci.json \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

  deploy_rules:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.rules_changed == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || 'colinmichaels' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLINMICHAELS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/validate-firebase-service-account.mjs

      - name: Create Firebase ADC credentials file
        id: firebase-auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLINMICHAELS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/write-firebase-service-account.mjs

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Firebase security rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase-auth.outputs.credentials_file_path }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.firebase-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail

          export CLOUDSDK_CORE_PROJECT="$FIREBASE_PROJECT_ID"
          export GOOGLE_CLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GCLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GCP_PROJECT="$FIREBASE_PROJECT_ID"
          export CLOUDSDK_CONFIG="${RUNNER_TEMP:-/tmp}/gcloud"
          mkdir -p "$CLOUDSDK_CONFIG"

          gcloud auth activate-service-account \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" \
            --project="$FIREBASE_PROJECT_ID"
          gcloud config set project "$FIREBASE_PROJECT_ID"

          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          if [ -z "$active_account" ]; then
            echo "gcloud did not activate a service account." >&2
            exit 1
          fi

          echo "gcloud active account: $active_account"
          gcloud auth print-access-token >/dev/null

          env -u FIREBASE_TOKEN npx --yes firebase-tools@14 deploy \
            --only firestore:rules,database,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

  deploy_hosting:
    needs:
      - detect_changes
      - build_hosting
      - deploy_functions
      - deploy_rules
    if: ${{ always() && needs.detect_changes.outputs.hosting_changed == 'true' && needs.build_hosting.result == 'success' && (needs.detect_changes.outputs.functions_deploy_needed != 'true' || needs.deploy_functions.result == 'success') && (needs.detect_changes.outputs.rules_changed != 'true' || needs.deploy_rules.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || 'colinmichaels' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Download Hosting build artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-hosting-production
          path: dist/colin-michaels-firebase/browser

      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLINMICHAELS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/validate-firebase-service-account.mjs

      - name: Create Firebase ADC credentials file
        id: firebase-auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLINMICHAELS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/write-firebase-service-account.mjs

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Create Firebase Hosting deploy config
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (config.hosting) {
            delete config.hosting.predeploy;
          }
          if (config.functions) {
            delete config.functions.predeploy;
          }
          fs.writeFileSync('firebase.hosting.ci.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase-auth.outputs.credentials_file_path }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.firebase-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail

          export CLOUDSDK_CORE_PROJECT="$FIREBASE_PROJECT_ID"
          export GOOGLE_CLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GCLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GCP_PROJECT="$FIREBASE_PROJECT_ID"
          export CLOUDSDK_CONFIG="${RUNNER_TEMP:-/tmp}/gcloud"
          mkdir -p "$CLOUDSDK_CONFIG"

          gcloud auth activate-service-account \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" \
            --project="$FIREBASE_PROJECT_ID"
          gcloud config set project "$FIREBASE_PROJECT_ID"

          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          if [ -z "$active_account" ]; then
            echo "gcloud did not activate a service account." >&2
            exit 1
          fi

          echo "gcloud active account: $active_account"
          gcloud auth print-access-token >/dev/null

          env -u FIREBASE_TOKEN npx --yes firebase-tools@14 deploy \
            --only hosting \
            --config firebase.hosting.ci.json \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
