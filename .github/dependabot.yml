version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Angular and compiler-API tooling still require the TypeScript 6 API.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      firebase-web:
        patterns: [firebase, '@firebase/rules-unit-testing']
      tailwind:
        patterns: [tailwindcss, '@tailwindcss/*']
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - angular-eslint
          - ng-packagr
      angular-security:
        applies-to: security-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - angular-eslint
          - ng-packagr
  - package-ecosystem: npm
    directory: /functions
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      firebase-server:
        patterns: [firebase-admin, firebase-functions]
  - package-ecosystem: npm
    directories:
      - /labs/reader-membership-campaign
      - /labs/higgsfield-promotion-campaign/motion-kit
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      remotion:
        patterns:
          - '@remotion/*'
          - remotion
          - react
          - react-dom
