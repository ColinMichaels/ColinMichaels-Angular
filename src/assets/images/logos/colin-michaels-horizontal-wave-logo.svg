<svg class="site-logo-svg" xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img"
     aria-labelledby="title desc">
  <title id="title">Colin Michaels horizontal logo</title>
  <desc id="desc">A horizontal Colin Michaels logo with a wave line, mountain peaks, and wordmark.</desc>

  <style>
    :root {
      --font-heading: 'Lexend', 'Source Sans 3', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-accent: 'K2D', 'Lexend', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --site-bg: #09090b;
      --site-accent: #22d3ee;
      --site-accent-strong: #67e8f9;
      --site-heading: #fafafa;
      --site-muted: #a1a1aa;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --site-bg: #f8fafc;
        --site-accent: #0891b2;
        --site-accent-strong: #0e7490;
        --site-heading: #0f172a;
        --site-muted: #475569;
      }
    }

    .site-logo-svg {
      --logo-heading: var(--site-heading);
      --logo-accent: var(--site-accent);
      --logo-accent-strong: var(--site-accent-strong);
      --logo-muted: var(--site-muted);
      --logo-bg: var(--site-bg);
      --logo-wave-start-opacity: 0.18;
      --logo-base-opacity: 0.32;
      overflow: visible;
      text-rendering: optimizeLegibility;
    }

    .site-logo-svg:is(:hover, :focus-visible) {
      --logo-heading: var(--logo-accent-strong);
      --logo-accent: var(--site-heading);
      --logo-muted: var(--site-accent);
      --logo-wave-start-opacity: 0.42;
      --logo-base-opacity: 0.48;
    }

    .site-logo-wave-start,
    .site-logo-wave-mid {
      stop-color: var(--logo-accent);
    }

    .site-logo-wave-start {
      stop-opacity: var(--logo-wave-start-opacity);
    }

    .site-logo-wave-end {
      stop-color: var(--logo-muted);
    }

    .site-logo-shadow {
      flood-color: var(--logo-bg);
      flood-opacity: 0.25;
    }

    .site-logo-mountain {
      stroke: var(--logo-heading);
    }

    .site-logo-ridges {
      stroke: var(--logo-muted);
    }

    .site-logo-base {
      stroke: var(--logo-bg);
      stroke-opacity: var(--logo-base-opacity);
    }

    .site-logo-wordmark {
      fill: var(--logo-heading);
      font-family: var(--font-heading);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 7px;
    }

    .site-logo-tagline {
      fill: var(--logo-accent);
      font-family: var(--font-accent);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 6px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .site-logo-wave-start,
      .site-logo-wave-mid,
      .site-logo-wave-end,
      .site-logo-mountain,
      .site-logo-ridges,
      .site-logo-base,
      .site-logo-wordmark,
      .site-logo-tagline {
        transition: stop-color 180ms ease, stop-opacity 180ms ease, stroke 180ms ease, stroke-opacity 180ms ease, fill 180ms ease;
      }
    }
  </style>

  <defs>
    <linearGradient id="waveGradient" x1="0" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop class="site-logo-wave-start" offset="0"/>
      <stop class="site-logo-wave-mid" offset="0.35"/>
      <stop class="site-logo-wave-end" offset="1"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow class="site-logo-shadow" dx="0" dy="4" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Mark -->
  <g transform="translate(34 34)" filter="url(#softShadow)">
    <!-- wave / path line -->
    <path d="M0 91
             C22 91, 37 88, 51 76
             C64 65, 76 45, 91 45
             C107 45, 116 66, 130 69
             C143 72, 151 55, 164 54
             C181 53, 195 72, 214 78
             C232 84, 248 88, 270 88"
          class="site-logo-wave"
          fill="none"
          stroke="url(#waveGradient)"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- mountain line -->
    <path d="M78 80
             L118 30
             L147 62
             L172 39
             L220 84"
          class="site-logo-mountain"
          fill="none"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- secondary ridges -->
    <path d="M99 58 L116 74 L129 48
             M145 64 L156 74 L170 52
             M190 69 L202 82"
          class="site-logo-ridges"
          fill="none"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- subtle dark base line -->
    <path d="M52 91 C96 86, 129 83, 174 88 C210 92, 238 91, 270 88"
          class="site-logo-base"
          fill="none"
          stroke-width="3"
          stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(330 58)">
    <text class="site-logo-wordmark" x="0" y="48">COLIN MICHAELS</text>
    <text class="site-logo-tagline" x="2" y="84">EXPLORE. LEARN. CREATE.</text>
  </g>
</svg>
