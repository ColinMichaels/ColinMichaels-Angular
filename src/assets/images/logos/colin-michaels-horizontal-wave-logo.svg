<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" aria-labelledby="title desc" class="site-logo-svg" role="img" viewBox="0 0 760 180"><title id="title">Colin Michaels horizontal logo</title><desc id="desc">A horizontal Colin Michaels logo with a wave line, mountain peaks, and wordmark.</desc><style>:root{--font-heading:&apos;Lexend&apos;, &apos;Source Sans 3&apos;, system-ui, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif;--font-accent:&apos;K2D&apos;, &apos;Lexend&apos;, system-ui, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif;--site-bg:#09090b;--site-accent:#22d3ee;--site-accent-strong:#67e8f9;--site-heading:#fafafa;--site-muted:#a1a1aa}@media (prefers-color-scheme:light){:root{--site-bg:#f8fafc;--site-accent:#0891b2;--site-accent-strong:#0e7490;--site-heading:#0f172a;--site-muted:#475569}}.site-logo-svg{--logo-heading:var(--site-heading);--logo-accent:var(--site-accent);--logo-accent-strong:var(--site-accent-strong);--logo-muted:var(--site-muted);--logo-bg:var(--site-bg);--logo-wave-start-opacity:0.18;--logo-base-opacity:0.32;overflow:visible;text-rendering:optimizeLegibility}.site-logo-svg:is(:hover, :focus-visible){--logo-heading:var(--logo-accent-strong);--logo-accent:var(--site-heading);--logo-muted:var(--site-accent);--logo-wave-start-opacity:0.42;--logo-base-opacity:0.48}.site-logo-wave-mid,.site-logo-wave-start{stop-color:var(--logo-accent)}.site-logo-wave-start{stop-opacity:var(--logo-wave-start-opacity)}.site-logo-wave-end{stop-color:var(--logo-muted)}.site-logo-shadow{flood-color:var(--logo-bg);flood-opacity:.25}.site-logo-mountain{stroke:var(--logo-heading)}.site-logo-ridges{stroke:var(--logo-muted)}.site-logo-base{stroke:var(--logo-bg);stroke-opacity:var(--logo-base-opacity)}.site-logo-wordmark{fill:var(--logo-heading);font-family:var(--font-heading);font-size:34px;font-weight:700;letter-spacing:7px}.site-logo-tagline{fill:var(--logo-accent);font-family:var(--font-accent);font-size:16px;font-weight:600;letter-spacing:6px}@media (prefers-reduced-motion:no-preference){.site-logo-base,.site-logo-mountain,.site-logo-ridges,.site-logo-tagline,.site-logo-wave-end,.site-logo-wave-mid,.site-logo-wave-start,.site-logo-wordmark{transition:stop-color 180ms ease,stop-opacity 180ms ease,stroke 180ms ease,stroke-opacity 180ms ease,fill 180ms ease}}</style><defs><linearGradient id="waveGradient" x1="0" x2="170" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop class="site-logo-wave-start" offset="0"/><stop class="site-logo-wave-mid" offset=".35"/><stop class="site-logo-wave-end" offset="1"/></linearGradient><filter id="softShadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow class="site-logo-shadow" dx="0" dy="4" stdDeviation="4"/></filter></defs><g filter="url(#softShadow)" transform="translate(34 34)"><path fill="none" stroke="url(#waveGradient)" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" d="M0 91 C22 91, 37 88, 51 76 C64 65, 76 45, 91 45 C107 45, 116 66, 130 69 C143 72, 151 55, 164 54 C181 53, 195 72, 214 78 C232 84, 248 88, 270 88" class="site-logo-wave"/><path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" d="M78 80 L118 30 L147 62 L172 39 L220 84" class="site-logo-mountain"/><path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M99 58 L116 74 L129 48 M145 64 L156 74 L170 52 M190 69 L202 82" class="site-logo-ridges"/><path fill="none" stroke-linecap="round" stroke-width="3" d="M52 91 C96 86, 129 83, 174 88 C210 92, 238 91, 270 88" class="site-logo-base"/></g><g><text x="0" y="48" class="site-logo-wordmark" transform="translate(330 58)">COLIN MICHAELS</text><text x="2" y="84" class="site-logo-tagline" transform="translate(330 58)">EXPLORE. LEARN. CREATE.</text></g></svg>