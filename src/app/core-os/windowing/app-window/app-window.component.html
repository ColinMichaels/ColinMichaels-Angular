<!-- app-window.component.html -->
<div tabindex="0" *ngIf="isVisible" #appWindow
     (mousedown)="bringToFront($event)"
     (focusin)="focusFromKeyboard($event)"
     role="dialog"
     [attr.aria-label]="windowLabel"
     [attr.data-window-id]="id"
     [class.hidden]="minimized"
     class="app-window fixed flex flex-col max-h-screen rounded-lg border border-white/10 shadow-lg overflow-hidden"
     [class.window-unfocused]="!focused"
     [ngClass]="[
       autoFit ? 'w-fit' : defaultWidth,
       autoFit ? '' : defaultHeight
     ]">
  <!-- Title Bar -->
  <div #header
       (dblclick)="onHeaderDoubleClick($event)"
       class="app-window-header relative flex items-center justify-between px-3 py-1  rounded-t-lg cursor-move select-none pointer-events-auto">
    <div class="flex space-x-0.5 text-zinc-700 cursor-pointer text-[6px]" role="group" aria-label="Window controls" (mouseenter)="showSizeIcons = true"
         (mouseleave)="showSizeIcons = false">
      <button type="button" class="flex h-8 w-8 items-center justify-center rounded-full border-0 bg-transparent p-0 leading-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
              [attr.aria-label]="'Close ' + windowLabel" (click)="closeApp()">
        <fa-stack>
          <fa-icon [icon]="faCircle" stackItemSize="2x" class="text-red-500"></fa-icon>
          <fa-icon [icon]="faTimes" stackItemSize="2x" [class.hidden]="!showSizeIcons"></fa-icon>
        </fa-stack>
      </button>

      <button type="button" class="flex h-8 w-8 items-center justify-center rounded-full border-0 bg-transparent p-0 leading-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
              [attr.aria-label]="'Minimize ' + windowLabel + ' to Dock'" (click)="minimizeToDock()">
        <fa-stack>
          <fa-icon [icon]="faCircle" stackItemSize="2x" class="text-yellow-400"></fa-icon>
          <fa-icon [icon]="faMinus" stackItemSize="2x" [class.hidden]="!showSizeIcons"></fa-icon>
        </fa-stack>
      </button>

      <button type="button" class="flex h-8 w-8 items-center justify-center rounded-full border-0 bg-transparent p-0 leading-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
              [attr.aria-label]="(isMaximized ? 'Restore ' : 'Zoom ') + windowLabel" [disabled]="autoFit" (click)="toggleMaximize()">
        <fa-stack>
          <fa-icon [icon]="faCircle" stackItemSize="2x" class="text-green-500"></fa-icon>
          <fa-icon [icon]="faUpRightAndDownLeftFromCenter" stackItemSize="1x" [class.hidden]="!showSizeIcons"></fa-icon>
        </fa-stack>
      </button>
    </div>
    <div class="title text-xs text-white/90 font-medium truncate"
         *ngIf="!autoFit"
         [class.hidden]="isCollapsed || autoFit"
         [class.title-unfocused]="!focused">{{ title }}
    </div>
    <div class="w-12"></div>
  </div>

  <!-- Window Content Area -->
  <div [class.hidden]="isCollapsed" [class.h-full]="!isCollapsed" [class.window-unfocused]="!focused"
       class="overflow-hidden max-h-screen h-full w-full">
    <ng-container #appWindowContent ></ng-container>
  </div>

  <!-- Resize Handle -->
  <div #resizeHandle
       [class.cursor-nwse-resize]="!autoFit"
       [class.pointer-events-none]="autoFit"
       [class.hidden]="isCollapsed || autoFit"
       class="absolute bottom-0 right-0 w-2 h-2 bg-transparent z-50">
    <div class="absolute bottom-0 right-0 w-3 h-3
              cursor-nwse-resize transform -translate-x-2.5 -translate-y-2.5"
         style="clip-path: polygon(100% 0, 0 100%, 100% 100%);
              background-color: #3f3f46;">
    </div>
  </div>

</div>
