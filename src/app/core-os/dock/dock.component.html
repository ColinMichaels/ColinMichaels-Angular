<!-- Desktop-only shell chrome; application content remains owned by its feature. -->
<div class="fixed bottom-2 w-full flex justify-center px-4">
  <nav aria-label="Dock" class="dock-back flex max-w-[calc(100vw-2rem)] items-center justify-end overflow-visible
  border border-white/10 px-3 py-2 shadow-2xl pointer-events-auto">
    <div class="min-w-0 overflow-x-auto overflow-y-hidden -mt-4 px-1 pt-4 pb-1">
    <section aria-label="Applications" class="flex w-max space-x-2 pointer-events-auto">
      <ng-container *ngFor="let app of dockApps; trackBy: trackApp">
        <div class="relative">
          <button type="button"
                  (click)="openApp(app.id)"
                  [attr.data-dock-app-id]="app.id"
                  [attr.aria-label]="getDockActionLabel(app)"
                  [attr.aria-current]="app.focused ? 'true' : null"
                  [tooltipShowArrow]="true"
                  [appTooltip]="app.title"
                  [class.dock-icon]="!app.icon"
                  [class.dock-app-button--opening]="openingAppId() === app.id"
                  class="dock-app-button pointer-events-auto">
            <div *ngIf="app.icon; else showTitle">
              <fa-icon [icon]="app.icon.svgPath" [class]="app.icon.class"></fa-icon>
            </div>
            <ng-template #showTitle>
              <span>{{ app.title | abbreviation }}</span>
            </ng-template>

          </button>
          <div *ngIf="app.running"
               aria-hidden="true"
               class="absolute -bottom-1 left-1/2 h-1 w-1 -translate-x-1/2 rounded-full bg-zinc-300 shadow-xl pointer-events-none"></div>
        </div>
      </ng-container>
    </section>
    </div>
    <!-- Divider -->
    <span aria-hidden="true" class="w-px h-8 mx-3 bg-white/20 backdrop-blur-sm rounded"></span>
    <!-- /Divider -->
    <section class="flex flex-grow-0 space-x-2 text-zinc-400 cursor-pointer pointer-events-auto">

      <button *ngIf="isSignedIn()" type="button" class="dock-utility-button"
              aria-label="Profile"
              (click)="navigateTo('/profile')" [tooltipShowArrow]="true" [appTooltip]="'Profile'">
        <fa-icon [icon]="faUser">
        </fa-icon>
      </button>
      <button *ngIf="canOpenAdmin()" type="button" class="dock-utility-button"
              aria-label="Admin"
              (click)="navigateTo('/admin')" [tooltipShowArrow]="true" [appTooltip]="'Admin'">
        <fa-icon [icon]="faShield">
        </fa-icon>
      </button>
      <button *ngIf="canManageUsers()" type="button" class="dock-utility-button"
              aria-label="User Management"
              (click)="navigateTo('/admin/users')" [tooltipShowArrow]="true" [appTooltip]="'User Management'">
        <fa-icon [icon]="faUsers">
        </fa-icon>
      </button>
      <button type="button" class="dock-utility-button"
              aria-label="Generate test notification"
              (click)="notify()" [tooltipShowArrow]="true" [appTooltip]="'TEST Notifications'">
        <fa-stack [size]="'xs'">
          <fa-icon [icon]="faSquare" [stackItemSize]="'2x'" class="text-purple-800 active:text-yellow-500"></fa-icon>
          <fa-icon [icon]="faBell" [stackItemSize]="'1x'" [inverse]="true"
                   class="text-yellow-400 hover:text-yellow-500 active:text-purple-800"></fa-icon>
        </fa-stack>
      </button>
      <button type="button" class="dock-utility-button"
              aria-label="Log Out"
              (click)="logout()" [tooltipShowArrow]="true" [appTooltip]="'Log Out'">
        <fa-icon [icon]="faRightFromBracket">
        </fa-icon>
      </button>
      <button type="button"
              class="dock-utility-button text-zinc-500/50 hover:text-white/50"
              aria-label="Trash"
              (click)="openApp('finder', {path: 'trash'})" (dblclick)="trash('user')" tooltipSize="sm"
              [appTooltip]="'Trash'">
        <fa-icon [icon]="faTrashCan">
        </fa-icon>
      </button>

    </section>
  </nav>
</div>
