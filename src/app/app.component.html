@if (showOsNotifications()) {
  @defer (when showOsNotifications()) {
    <app-notification-server/>
  }
}
@if (showSiteHeader()) {
  <a class="site-skip-link" href="#main-content">Skip to main content</a>
  <app-site-header/>
  <app-pwa-status/>
}
<div
  id="main-content"
  tabindex="-1"
  class="app-route-frame min-h-[100dvh] bg-zinc-800/70"
  [class.public-reader-scope]="showReaderTools()"
  [class.pb-28]="activeUserView()"
>
  <router-outlet></router-outlet>
  @if (showReaderTools()) {
    @defer (when showReaderTools()) {
      <app-reader-tools/>
    }
  }
</div>
<app-user-view-banner/>
<app-screen-saver-launcher/>
@if (showBlogMembershipCampaign()) {
  @defer (when showBlogMembershipCampaign()) {
    <app-blog-membership-campaign/>
  }
}
