<div class="flex h-screen text-white bg-zinc-900">
  <!-- Sidebar -->
  <aside class="w-60 border-r border-white/10 bg-zinc-800 p-4 space-y-1 text-xs">
    <header class="text-zinc-500 text-xs">Favorites</header>
    <div *ngFor="let dir of favoriteDirs"
         class="flex items-center space-x-2 py-1 rounded hover:bg-white/10 cursor-pointer"
         [class.bg-white-50]="dir.path === currentPath"
         (click)="navigate(dir.path)">
      <span class="text-blue-400"><i class="fa fa-folder"></i></span>
      <span class="truncate w-1/3">{{ dir.name }}</span>
    </div>
  </aside>

  <!-- Main Panel -->
  <div class="flex-1 flex flex-col">
    <!-- Toolbar -->
    <div class="flex items-center justify-between border-b border-white/10 bg-zinc-900 px-4 py-2 text-sm">
      <div class="flex items-center space-x-2">
        <button (click)="goBack()" class="hover:bg-white/10 p-1 rounded">←</button>
        <button (click)="goForward()" class="hover:bg-white/10 p-1 rounded">→</button>
        <span class="ml-4 font-semibold truncate w-9/12">{{ getDirName(currentPath) }}</span>
      </div>
      <div class="flex items-center space-x-4">
        <select [(ngModel)]="sortBy" class="bg-zinc-800 border border-white/10 rounded px-2 py-1">
          <option value="name">Name</option>
          <option value="type">Type</option>
          <option value="modified">Modified</option>
        </select>
        <div class="flex flex-col space-y-1 justify-items-center text-center">
          <div class="space-x-2 text-zinc-600">
            <button (click)="setViewMode('list')" [class.text-white]="viewMode === 'list'"><i
              class="fa fa-list text-xs"></i></button>
            <button (click)="setViewMode('grid')" [class.text-white]="viewMode === 'grid'"><i
              class="fa fa-table-cells-large text-xs"></i></button>
            <button (click)="setViewMode('columns')" [class.text-white]="viewMode === 'columns'"><i
              class="fa fa-table-columns text-xs"></i></button>
          </div>
          <span class="text-xs text-gray-400">View</span>
        </div>
      </div>
    </div>
    <!-- File Browser Views -->
    <app-finder-window [viewMode]="viewMode" title="Finder">
      <!-- List View -->
      <div list-view *ngIf="(getCurrentDir() | async) as dir">
        <div *ngFor="let file of sortFiles(dir.children) trackBy: trackByName"
             class="flex w-full items-center justify-between px-4 py-1 text-sm text-white border-b border-white/10 hover:bg-white/10">
          <span *ngIf="file.isDir" class="fa fa-chevron-right text-[8px] text-white/50 absolute -translate-x-3"></span>
          <div class="flex space-x-2  justify-between w-full">
            <div class="flex items-center space-x-2 cursor-pointer w-1/3" (click)="file.isDir ? navigate(file.path) : null">
              <span [class]="file.isDir ? 'fa fa-folder text-blue-300' : 'fa fa-file'"></span>
              <span class="truncate text-xs">{{ file.name }}</span>
            </div>
            <span class="truncate text-gray-400 text-xs w-1/3">{{ file.modified | date: 'short' }}</span>
            <span class="text-xs text-gray-400 w-1/3">{{ file.type }}</span>
          </div>
        </div>
      </div>

      <!-- Grid View -->
      <div grid-view *ngIf="(getCurrentDir() | async) as dir">
        <div class="grid grid-cols-4 gap-4 p-4 text-white text-center">
          <div *ngFor="let file of dir.children; trackBy: trackByName" class="flex flex-col items-center cursor-pointer"
               (click)="file.isDir ? navigate(file.path) : null">
            <span [class]="file.isDir ? 'fa fa-folder text-blue-300' : 'fa fa-file'"></span>
            <div class="truncate w-20 text-[10px]">{{ file.name }}</div>
          </div>
        </div>
      </div>

      <!-- Columns View -->
      <div columns-view *ngIf="(getCurrentDir() | async) as dir">
        <div class="flex h-full overflow-hidden text-white">
          <div class="w-1/3 border-r border-white/10 overflow-auto">
            <div *ngFor="let file of dir.children; trackBy: trackByName"
                 class="hover:bg-white/10 px-2 py-1 rounded cursor-pointer text-xs"
                 (click)="file.isDir ? navigate(file.path) : null">
              <div class="flex flex-auto items-center justify-around space-x-1">
                <span [class]="file.isDir ? 'fa fa-folder text-blue-300' : 'fa fa-file'"></span>
                <div class="truncate w-20 text-[10px]">{{ file.name }}</div>
                <span *ngIf="file.isDir" class="fa fa-chevron-right text-[8px] text-zinc-600 justify-self-end"></span>
              </div>
            </div>
          </div>
          <div class="w-2/3 p-4">
            <p class="text-xs text-gray-400">Select a file or folder to view its details.</p>
          </div>
        </div>
      </div>
    </app-finder-window>
  </div>
</div>
