<div class="flex h-full text-white bg-zinc-900 overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-1/4 border-r border-white/10 bg-zinc-800 p-4 space-y-1 text-xs overflow-y-auto">
    <header class="text-zinc-500 text-xs">Favorites</header>
    <div *ngFor="let dir of favoriteDirs"
         class="flex items-center space-x-2 py-1 rounded hover:bg-white/10 cursor-pointer"
         [class.bg-white-50]="dir.path === currentPath"
         (click)="navigate(dir.path)">
      <span class="text-blue-400"><fa-icon [icon]="faFolder"></fa-icon></span>
      <span class="truncate w-9/12">{{ dir.name }}</span>
    </div>
  </aside>

  <!-- Main Panel -->
  <div class="flex-1 flex flex-col">
    <!-- Toolbar -->
    <div class="flex items-center justify-between border-b border-white/10 bg-zinc-900 px-4 py-2 text-sm">
      <div class="flex justify-between space-x-4 text-zinc-500">
        <div class="flex flex-col items-center">
          <div class="flex space-x-4">
            <fa-icon [icon]="faChevronLeft" size="sm" class="hover:text-zinc-300" (click)="goBack()"></fa-icon>
            <fa-icon [icon]="faChevronRight" size="sm" class="hover:text-zinc-300"  (click)="goForward()"></fa-icon>
          </div>
          <div class="text-zinc-500 text-[10px]">Back/Forward</div>
        </div>



        <span class="ml-4 font-semibold truncate w-9/12">{{ getDirName(currentPath) }}</span>
      </div>
      <div class="flex space-x-2">
        <fa-icon [icon]="faSearch" size="sm" class="hover:text-zinc-300 text-zinc-500"></fa-icon>
      </div>
      <div class="flex items-center space-x-4">
        <select [(ngModel)]="sortBy" class="menu-dropdown">
          <option value="name">Name</option>
          <option value="type">Type</option>
          <option value="modified">Modified</option>
        </select>
        <div class="flex flex-col space-y-1 justify-items-center text-center">
          <div class="space-x-2 text-zinc-600">
            <button (click)="setViewMode(VIEW_MODES.list)" [class.text-white]="viewMode === VIEW_MODES.list">
              <fa-icon [icon]="faList" size="sm"></fa-icon>
            </button>
            <button (click)="setViewMode(VIEW_MODES.grid)" [class.text-white]="viewMode === VIEW_MODES.grid">
              <fa-icon [icon]="faTableCellsLarge" size="sm"></fa-icon>
            </button>
            <button (click)="setViewMode(VIEW_MODES.columns)" [class.text-white]="viewMode === VIEW_MODES.columns">
              <fa-icon [icon]="faTableColumns"  size="sm"></fa-icon>
            </button>
          </div>
          <span class="text-[10px] text-zinc-400">View</span>
        </div>
      </div>
    </div>
    <!-- File Browser Views -->
    <div class="overflow-y-auto">
    <app-finder-window [viewMode]="viewMode" title="Finder">
      <!-- List View -->
      <div list-view *ngIf="(getCurrentDir() | async) as dir">
        <div *ngFor="let file of sortFiles(dir.children) trackBy: trackByName"
             class="flex w-full items-center justify-between px-4 py-1 text-sm text-white border-b border-white/10 hover:bg-white/10">
          <fa-icon *ngIf="file.isDir" [icon]="faChevronRight"  size="xs" class="text-white/50 -mr-3 -translate-x-3"></fa-icon>
          <div class="flex space-x-2  justify-between w-full">
            <div class="flex items-center space-x-2 cursor-pointer w-1/3" (click)="file.isDir ? navigate(file.path) : null">
              <fa-icon [icon]="file.isDir ? faFolder : faFile" [class]="file.isDir ? 'text-blue-300' : ''"></fa-icon>
              <span class="truncate text-xs">{{ file.name }}</span>
            </div>
            <span class="truncate text-gray-400 text-xs w-1/3">{{ file.modified | date: 'short' }}</span>
            <span class="text-xs text-gray-400 w-1/3">{{ file.type }}</span>
          </div>
        </div>
      </div>

      <!-- Grid View -->
      <div grid-view *ngIf="(getCurrentDir() | async) as dir">
        <div class="grid grid-cols-4 gap-4 p-4 text-white text-center">
          <div *ngFor="let file of dir.children; trackBy: trackByName" class="flex flex-col items-center cursor-pointer"
               (click)="file.isDir ? navigate(file.path) : null">
            <fa-icon [icon]="file.isDir ? faFolder : faFile" [class.text-blue-300]="file.isDir"></fa-icon>
            <div class="truncate w-20 text-[10px]">{{ file.name }}</div>
          </div>
        </div>
      </div>

      <!-- Columns View -->
      <div columns-view *ngIf="(getCurrentDir() | async) as dir">
        <div class="flex h-full overflow-hidden text-white">
          <div class="w-1/3 border-r border-white/10 overflow-auto">
            <div *ngFor="let file of dir.children; trackBy: trackByName"
                 class="hover:bg-white/10 px-2 py-1 rounded cursor-pointer text-xs"
                 (click)="file.isDir ? navigate(file.path) : null">
              <div class="flex flex-auto items-center justify-around space-x-1">
                <fa-icon [icon]="file.isDir ? faFolder: faFile" [class.text-blue-300]="file.isDir"></fa-icon>
                <div class="truncate w-20 text-[10px]">{{ file.name }}</div>
                <fa-icon [icon]="faChevronRight" size="xs" *ngIf="file.isDir" class=" text-zinc-600 justify-self-end"></fa-icon>
              </div>
            </div>
          </div>
          <div class="w-2/3 p-4">
            <p class="text-xs text-gray-400">Select a file or folder to view its details.</p>
          </div>
        </div>
      </div>
    </app-finder-window>
    </div>
  </div>
</div>
