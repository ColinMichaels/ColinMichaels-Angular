<!-- system-tray.component.html -->
<div
  class="fixed top-0 left-0 w-full z-50
  shadow-2xl
  transform-gpu transition-transform duration-500  border-b border-white/10"
  [class.-translate-y-full]="!isVisible() && !menuOpen()"
  [class.translate-y-0]="isVisible()"
  (blur)="isVisible.set(false)"
  (mouseout)="isVisible.set(false)"
  (mouseenter)="isHoveringMenu.set(true)"
  (mouseleave)="toggleMenu('')"
>
  <div class="h-8 bg-zinc-900/50 text-white flex items-center justify-between pl-2 pr-4">
    <div class="flex items-center text-xs h-full">
      <section class="relative">
        <button type="button"
                class="cursor-pointer hover:bg-zinc-800 px-2 py-1 rounded"
                aria-label="Apple menu"
                aria-haspopup="menu"
                [attr.aria-expanded]="menuOpen() === 'apple'"
                [ngClass]="{ 'bg-zinc-800': menuOpen() === 'apple' }"
                (click)="toggleMenu('apple')">
          <fa-icon [icon]="faApple" size="1x"></fa-icon>
        </button>
        <div
          *ngIf="menuOpen() === 'apple'"
          class="menu-dropdown absolute top-6"
          role="menu"
          (mouseenter)="isHoveringMenu.set(true)"
          (mouseleave)="isHoveringMenu.set(false)"
        >
          <button type="button" role="menuitem" class="menu-item w-full text-left" (click)="openApp('about')">About This App</button>
          <hr class="menu-separator"/>
          <button type="button" role="menuitem" class="menu-item w-full text-left" (click)="openApp('system-settings')">System Settings</button>
          <hr class="menu-separator"/>
            <a role="menuitem" class="menu-item block" [routerLink]="['/sleep']">Sleep</a>
            <a role="menuitem" class="menu-item block" [routerLink]="['/boot']">Restart</a>
            <a role="menuitem" class="menu-item block" [routerLink]="['/']">Shutdown</a>
            <hr class="menu-separator"/>
          <a role="menuitem" class="menu-item block" [routerLink]="['/']">Log Out {{ userName }}</a>
        </div>
      </section>
      <section class="relative">
        <button type="button"
                class="cursor-pointer hover:bg-zinc-800 px-2 py-1 rounded"
                aria-haspopup="menu"
                [attr.aria-expanded]="menuOpen() === 'file'"
                [ngClass]="{ 'bg-zinc-800': menuOpen() === 'file' }"
                (click)="toggleMenu('file')">
          File
        </button>
        <div
          *ngIf="menuOpen() === 'file'"
          class="menu-dropdown absolute -left-2 top-6"
          role="menu"
          (mouseenter)="isHoveringMenu.set(true)"
          (mouseleave)="isHoveringMenu.set(false)"
        >
          <button type="button" role="menuitem" class="menu-item w-full text-left" (click)="openApp('finder')">New Window</button>
          <button type="button" role="menuitem" class="menu-item w-full text-left" [class.disabled]="false" (click)="closeAllApps()">Close All</button>
        </div>
      </section>
      <section class="relative">
        <button type="button"
                class="cursor-pointer hover:bg-zinc-800 px-2 py-1 rounded"
                aria-haspopup="menu"
                [attr.aria-expanded]="menuOpen() === 'view'"
                [ngClass]="{ 'bg-zinc-800': menuOpen() === 'view' }"
                (click)="toggleMenu('view')">
          View
        </button>
        <div
          *ngIf="menuOpen() === 'view'"
          class="menu-dropdown absolute -left-2 top-6"
          role="menu"
          (mouseenter)="isHoveringMenu.set(true)"
          (mouseleave)="isHoveringMenu.set(false)"
        >
          <button type="button" role="menuitemradio" class="menu-item w-full text-left"
                  [attr.aria-checked]="viewMode() === VIEW_MODES.columns"
                  [class.active]="viewMode() === VIEW_MODES.columns"
                  (click)="setViewMode(VIEW_MODES.columns)">as Icons</button>
          <button type="button" role="menuitemradio" class="menu-item w-full text-left"
                  [attr.aria-checked]="viewMode() === VIEW_MODES.list"
                  [class.active]="viewMode() === VIEW_MODES.list"
                  (click)="setViewMode(VIEW_MODES.list)">as List</button>
          <button type="button" role="menuitemradio" class="menu-item w-full text-left"
                  [attr.aria-checked]="viewMode() === VIEW_MODES.grid"
                  [class.active]="viewMode() === VIEW_MODES.grid"
                  (click)="setViewMode(VIEW_MODES.grid)">as Grid</button>
        </div>
      </section>
      <section class="relative">
        <button type="button"
                class="cursor-pointer hover:bg-zinc-800 px-2 py-1 rounded"
                aria-haspopup="menu"
                [attr.aria-expanded]="menuOpen() === 'apps'"
                [ngClass]="{ 'bg-zinc-800': menuOpen() === 'apps' }"
                (click)="toggleMenu('apps')">Apps
        </button>
        <div
          *ngIf="menuOpen() === 'apps'"
          class="menu-dropdown absolute -left-2 top-6"
          role="menu"
          (mouseenter)="isHoveringMenu.set(true)"
          (mouseleave)="isHoveringMenu.set(false)"
        >
          <ng-container *ngFor="let app of appManager.registeredApps">
            <button *ngIf="app.installed"
                    type="button"
                    role="menuitem"
                    (click)="app.running ? closeApp(app.id) : openApp(app.id)"
                    [class.active]="app.running"
                    class="p-1 menu-item truncate w-full text-left">
              {{ app.title }}
            </button>
          </ng-container>
        </div>
      </section>
      <section class="relative">
        <button type="button"
                class="cursor-pointer hover:bg-zinc-800 px-2 py-1 rounded"
                aria-haspopup="menu"
                [attr.aria-expanded]="menuOpen() === 'help'"
                [ngClass]="{ 'bg-zinc-800': menuOpen() === 'help' }"
                (click)="toggleMenu('help')">
          Help
        </button>
        <div
          *ngIf="menuOpen() === 'help'"
          class="menu-dropdown absolute -left-2 top-6"
          role="menu"
          (mouseenter)="isHoveringMenu.set(true)"
          (mouseleave)="isHoveringMenu.set(false)"
        >
          <button type="button" role="menuitem" class="menu-item w-full text-left" (click)="openApp('about')">About This App</button>
        </div>
      </section>
    </div>


    <div class="flex space-x-4 justify-items-end align-middle">
      <section #memory class="relative text-[10px] flex-grow text-gray-300">
        <button type="button"
                class="cursor-pointer"
                aria-haspopup="menu"
                aria-label="Memory usage"
                [attr.aria-expanded]="menuOpen() === 'memory'"
                (click)="toggleMenu('memory')">
          <fa-icon [icon]="faMemory"></fa-icon>
          : {{ inGbs(usedMemory) }} / {{ inGbs(totalMemory) }}
          <span class="text-[6px]">GB</span>
        </button>
        <div
          *ngIf="menuOpen() === 'memory'"
          class="menu-dropdown absolute top-full"
          role="menu"
          (mouseenter)="isHoveringMenu.set(true)"
          (mouseleave)="isHoveringMenu.set(false)"
        >
          <div class="flex flex-col justify-around w-full">
            <button type="button" role="menuitem" class="flex justify-between menu-item w-full"
                    (click)="openApp('finder')">
              <span class="text-white/50">Finder</span>
              <span class="text-[8px]">512 MB</span>
            </button>
          <ng-container *ngFor="let app of runningApps">
            <div class="menu-separator"></div>
            <button type="button" role="menuitem" class="flex justify-between menu-item w-full"
                    (click)="openApp(app.id)">
                <span class="text-white/50 w-1/2 truncate">{{ app.title }}</span>
                <span class="text-[8px]">{{ app.memory }} MB</span>
            </button>
          </ng-container>
          </div>

        </div>

      </section>

      <section>
        <app-sound-player/>
      </section>

      <section class="flex self-center text-xs text-zinc-300">
        <fa-icon [icon]="faBatteryHalf" [title]="batteryLevel + '%'"/>
      </section>

      <section class="flex self-center">
        <app-clock-display/>
      </section>

    </div>

  </div>
</div>
