<!-- settings-panel.component.html -->
<div class="flex h-full w-full overflow-hidden text-white bg-zinc-900/80">
  <!-- Sidebar Navigation -->
  <aside class="w-40 flex-shrink-0 border-r border-black/30 bg-neutral-800  p-4 overflow-y-auto text-xs">
    <div class="flex justify-start justify-items-center align-middle ml-1 mb-2">

      <fa-icon [icon]="faUserCircle" class="text-3xl text-white/80"></fa-icon>

      <div class="flex flex-col items-start">
        <div class="text-[10px] font-semibold px-2">{{ userName }}</div>
        <div class="text-[10px] font-thin text-white/60 px-2">Account</div>
      </div>
    </div>
    <ul class="space-y-1">
      <li *ngFor="let item of settingsMenu">
        <button
          type="button"
          (click)="selectPanel(item)"
          class="flex w-full items-center space-x-2 p-1 rounded-lg cursor-pointer"
          [attr.aria-pressed]="activePanel.key === item.key"
          [ngClass]="{ 'bg-blue-700/70': activePanel.key === item.key }"
        >
          <fa-icon [icon]="item.icon"></fa-icon>
          <span class="truncate">{{ item.label }}</span>
        </button>
      </li>
    </ul>
  </aside>

  <!-- Settings Content -->
  <main class="flex-1 overflow-y-auto p-6 text-xs">
    <ng-container *ngIf="activePanel">
      <div class="mb-6">
        <div class="flex items-center space-x-4 bg-zinc-900/80 border border-white/10 p-2 rounded-lg shadow-lg">
          <fa-icon [icon]="activePanel.icon" class="text-2xl"></fa-icon>
          <div>
            <h2 class="text-sm font-semibold">{{ activePanel.label }}</h2>
            <p class="text-white/60">{{ activePanel.description }}</p>
          </div>
        </div>
      </div>

      <!-- Reusable inner panel component -->
      <app-settings-subpanel [panelKey]="activePanel.key"></app-settings-subpanel>
    </ng-container>
  </main>
</div>
