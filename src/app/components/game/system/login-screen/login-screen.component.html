<div class="h-screen w-screen bg-cover bg-center relative" [style]="`background-image: url(${backgroundImage})`">
  <!-- Blurred overlay -->
  <div class="absolute inset-0  backdrop-blur-md flex items-center justify-center">

    <!-- Login Box -->
    <div class="flex flex-col items-center text-white space-y-4">
      <!-- Avatar -->
      <div class=" overflow-hidden">
        <fa-stack [size]="'1x'">
          <fa-icon [icon]="faCircle" stackItemSize="2x" class="text-white/50  shadow-xl"></fa-icon>
          <fa-icon [icon]="faUser" stackItemSize="1x" class="text-white"></fa-icon>
        </fa-stack>
      </div>

      <!-- Username label (optional if prefilled) -->
      <h2 class="text-center text-lg">{{ isLoginMode ? 'Login' : 'Register' }}</h2>

      <!-- src/app/components/game/system/login-screen/login-screen.component.html -->
      <div class="login-container">
        <div class="login-card flex flex-col justify-center items-center">


          <!-- Error Message -->
          <div *ngIf="error" class="error-message mb-4 p-2 text-sm bg-red-100 text-red-700 rounded">
            {{ error }}
          </div>

          <!-- Login Form -->
          <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-4">
            <div class="form-group relative flex flex-col justify-center items-center">
              <input
                type="email"
                id="email"
                formControlName="email"
                class="login-input"
                placeholder="Enter your email">
              <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                   class="text-red-500 text-sm mt-1">
                Please enter a valid email address
              </div>
              <button
                [class.hidden]="loginForm.invalid"
                [disabled]="loading"
                type="submit"
                class="login-button disabled:cursor-not-allowed disabled:opacity-50">
                <fa-icon [icon]="faChevronRight"></fa-icon>
              </button>
            </div>

            <div class="form-group">
              <input
                type="password"
                id="password"
                formControlName="password"
                class="login-input"
                placeholder="Enter your password">
              <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                   class="text-red-500 text-sm mt-1">
                Password must be at least 6 characters
              </div>
            </div>

            <div class="form-actions">
              <div class="text-center my-2">
                <button
                  type="button"
                  (click)="resetPassword()"
                  class="text-gray-500 hover:text-white cursor-pointer text-sm bg-transparent border-0 p-0">
                  Forgot password?
                </button>
              </div>
            </div>
          </form>

          <!-- Register Form -->
          <form *ngIf="!isLoginMode" [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-4">
            <div class="form-group">
              <input
                type="text"
                id="displayName"
                formControlName="displayName"
                class="login-input"
                placeholder="Enter your name">
              <div *ngIf="registerForm.get('displayName')?.invalid && registerForm.get('displayName')?.touched"
                   class="text-red-500 text-sm mt-1">
                Display name must be at least 3 characters
              </div>
            </div>

            <div class="form-group">
              <input
                type="email"
                id="registerEmail"
                formControlName="email"
                class="login-input"
                placeholder="Enter your email">
              <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
                   class="text-red-500 text-sm mt-1">
                Please enter a valid email address
              </div>
            </div>

            <div class="form-group">
              <input
                type="password"
                id="registerPassword"
                formControlName="password"
                class="login-input"
                placeholder="Create a password">
              <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
                   class="text-red-500 text-sm mt-1">
                Password must be at least 6 characters
              </div>
            </div>

            <div class="form-group">
              <input
                type="password"
                id="confirmPassword"
                formControlName="confirmPassword"
                class="login-input"
                placeholder="Confirm password">
              <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched"
                   class="text-red-500 text-sm mt-1">
                Passwords don't match
              </div>
            </div>

            <div class="form-actions">
              <button
                type="submit"
                [disabled]="registerForm.invalid || loading"
                [class.bg-green-600]="!registerForm.invalid && !loading"
                class="w-full text-white p-2 rounded hover:bg-green-600 border border-white/30 text-sm disabled:opacity-50">
                {{ loading ? 'Registering...' : 'Register' }}
              </button>
            </div>
          </form>

          <!-- Provider Sign In -->
          <div class="my-4 w-full min-w-56 text-center">
            <span class="block mb-2 text-sm text-gray-500">OR</span>
            <div class="grid gap-3">
              <button
                type="button"
                (click)="loginWithGoogle()"
                [disabled]="loading"
                class="w-full text-sm text-gray-500 hover:text-white flex items-center justify-center gap-2 disabled:cursor-not-allowed disabled:opacity-60">
                <fa-icon [icon]="faGoogle" class="text-xl"></fa-icon>
                {{ googleLoading ? 'Opening Google...' : (isLoginMode ? 'Sign in with Google' : 'Sign up with Google') }}
              </button>
              <button
                type="button"
                (click)="loginWithFacebook()"
                [disabled]="loading"
                class="w-full text-sm text-gray-500 hover:text-white flex items-center justify-center gap-2 disabled:cursor-not-allowed disabled:opacity-60">
                <fa-icon [icon]="faFacebook" class="text-xl text-[#1877f2]"></fa-icon>
                {{ facebookLoading ? 'Opening Facebook...' : (isLoginMode ? 'Sign in with Facebook' : 'Sign up with Facebook') }}
              </button>
            </div>
          </div>

          <!-- Toggle Login/Register -->
          <div class="text-center">
            <button
              type="button"
              (click)="toggleMode()"
              class="text-gray-500 text-sm hover:text-white cursor-pointer bg-transparent border-0 p-0">
              {{ isLoginMode ? 'Need an account? Register' : 'Already have an account? Login' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="absolute bottom-6 inset-x-0 flex justify-center space-x-12 text-white/70 text-xs">
  <button
    type="button"
    class="flex flex-col items-center text-white/70 hover:text-white/90 bg-transparent border-0 p-0"
    (click)="sleep()">
    <fa-icon [icon]="faMoon" class="text-lg"></fa-icon>
    <span>Sleep</span>
  </button>
  <button
    type="button"
    class="flex flex-col items-center text-white/70 hover:text-white/90 bg-transparent border-0 p-0"
    (click)="restart()">
    <fa-icon [icon]="faRedo" class="text-lg"></fa-icon>
    <span>Restart</span>
  </button>
  <a class="flex flex-col items-center text-white/70 hover:text-white/90" [routerLink]="['/']">
    <fa-icon [icon]="faPowerOff" class="text-lg"></fa-icon>
    <span>Shut Down</span>
  </a>
</div>
