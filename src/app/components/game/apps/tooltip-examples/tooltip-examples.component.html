<div class="tool-tip-container flex flex-col bg-zinc-600 h-full  items-center justify-start gap-8 overflow-y-auto py-8">

  <div class="grid grid-cols-4 gap-x-8 gap-y-4" [class]="'grid-cols-' + (allTooltips.length * 2 + 1)">
    <div *ngFor="let tooltips of allTooltips" class="flex flex-col items-center space-y-4">
        <div class="text-white text-sm text-center">{{tooltips.title}}</div>
        <div class="grid grid-cols-2 gap-2">
          <div *ngFor="let tooltip of tooltips.tooltips"
               (click)="showNotify(
               tooltip,
               (tooltips.message ?? '') + buildNotifyMessage(tooltip))"
               [class]="tooltip.cssClass ?? 'tooltip-default'"
               class="w-12 h-12"
               [appTooltip]="tooltip.text"
               [tooltipShowArrow]="true"
               [tooltipSize]="tooltip.size ?? 'sm'"
               [tooltipPosition]="tooltip.position ?? 'top'"
               [tooltipAutoDismiss]="tooltip.autoDismissDelay ?? 3000"
               [tooltipHideDelay]="tooltip.hideDelay ?? 1000"
               [tooltipClass]="tooltip.toolTipClass ?? 'bg-zinc-800'"
          >
            {{ tooltip.text }}
          </div>
        </div>
    </div>

  </div>

  <div>
    <button class="mac-button" (click)="showDocs = !showDocs">{{ !showDocs ? 'Show' : 'Hide' }} Docs</button>
  </div>

  <ng-container *ngIf="showDocs" (click)="showDocs = false">

   <div class="prose h-50 max-w-none overflow-y-auto h-full text-white px-2 bg-zinc-800 border-t-2 border-zinc-800">
   <app-markdown-reader [filename]="docs"></app-markdown-reader>
    </div>
  </ng-container>

</div>
