<div class="min-w-[300px] h-full w-full max-w-4xl mx-auto">
  <div class="container mx-auto dark:bg-gray-800/50 bg-gray-100">
    <div *ngIf="!showNewTaskForm" class="flex justify-end items-center gap-x-2  px-4 py-2  bg-zinc-800/50">


      <div class="flex justify-center items-center gap-2">
        <!-- Advanced Filtering -->
        <div class="mb-4 space-y-2">
          <!-- Status Filters -->
          <div class="flex gap-2">
            <button *ngFor="let filter of statusFilters"
                    (click)="setStatusFilter(filter)"
                    class="px-3 py-1 text-sm rounded transition-colors"
                    [class.bg-blue-500]="currentFilter === filter"
                    [class.text-white]="currentFilter === filter"
                    [class.bg-gray-200]="currentFilter !== filter"
                    [class.dark:bg-gray-700]="currentFilter !== filter"
                    [class.text-gray-800]="currentFilter !== filter"
                    [class.dark:text-gray-200]="currentFilter !== filter">
              {{ filter | titlecase }}
              <span class="ml-1 text-xs">
          </span>
            </button>
          </div>

          <!-- Search Input -->
          <div class="flex gap-2">
            <input type="text"
                   [formControl]="searchControl"
                   placeholder="Search tasks..."
                   class="px-2 py-1 text-sm rounded border dark:border-gray-600
                      bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100
                      focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400">

            <!-- Type Filter -->
            <select [formControl]="typeFilter"
                    class="px-2 py-1 text-sm rounded border dark:border-gray-600
                       bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100
                       focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400">
              <option value="all">All Types</option>
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="shopping">Shopping</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

      </div>

      <button (click)="showNewTaskForm = true"
              class="px-2 py-0.5 text-sm rounded bg-blue-500 text-white
                         hover:bg-blue-600">
        <fa-icon [icon]="faPlus"></fa-icon>
      </button>
    </div>
    <!-- New Task Form -->
    <form [formGroup]="taskForm" (ngSubmit)="addNewTask()" *ngIf="showNewTaskForm"
          class="flex flex-col flex-wrap space-y-4 p-4 rounded-lg rounded-t-none bg-white dark:bg-gray-700 shadow-md">
      <div class="flex justify-between items-center">
        <div class="w-full">
          <select formControlName="type"
                  class="form-select px-2 py-1 w-full text-sm rounded border dark:border-gray-600
                             bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100
                             focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="w-full">
          <input type="date" formControlName="dueDate" [value]="defaultDateString"
                 class="form-input px-2 py-1 text-sm rounded border dark:border-gray-600
                              bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100
                              focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400">
        </div>
      </div>

      <div>
        <textarea type="text" formControlName="data" placeholder="Task description"
                  class="form-textarea w-full px-2 py-1 h-40 text-sm rounded border dark:border-gray-600
                          bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100
                          focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400">
          {{ taskForm.value.data }}
        </textarea>
      </div>

      <div class="flex gap-2">
        <button type="submit"
                [disabled]="!taskForm.valid"
                (keyup.enter)="addNewTask()"
                class="px-3 py-1 text-sm rounded bg-blue-500 text-white
                           hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">
          Add Task
        </button>
        <button type="button"
                (click)="showNewTaskForm = false"
                class="px-3 py-1 text-sm rounded bg-gray-200 dark:bg-gray-600
                           text-gray-800 dark:text-gray-200 hover:bg-gray-300
                           dark:hover:bg-gray-500">
          Cancel
        </button>
      </div>
    </form>

    <!-- Tasks List -->
    <div class=" space-y-2.5 p-2 shadow-lg  overflow-y-auto
    shadow-black/40 dark:shadow-white/40 rounded-lg border-2 border-t-0 border-gray-200 dark:border-gray-700">
      <ng-container *ngFor="let task of filteredTasks$ | async">
        <div class="py-1.5 rounded-lg bg-white dark:bg-gray-700 text-sm
                        flex justify-around">

          <!-- Status Indicator -->
          <div [ngSwitch]="task.status" class="flex items-center w-1/12 justify-center"
               [appTooltip]="task.status" [tooltipfadeDuration]="0" [tooltipAutoDismiss]="0"
               [tooltipCssClass]="'bg-black/50 text-white'">
            <div *ngSwitchCase="'completed'"
                 class="w-3 h-3 rounded-full bg-green-500"
                 title="Completed">
            </div>
            <div *ngSwitchCase="'archived'"
                 class="w-3 h-3 rounded-full bg-zinc-500"
                 title="Archived">
            </div>
            <div *ngSwitchDefault
                 class="w-3 h-3 rounded-full bg-yellow-500"
                 title="Pending">
            </div>
          </div>

          <div class="group relative flex-1 flex flex-col  rounded-lg px-2 py-0.5 w-9/12"
               [ngClass]="{
              'bg-blue-500/40': task.type === 'personal' && task.status === 'pending',
              'bg-green-500/40': task.type === 'work' && task.status === 'pending',
              'bg-yellow-500/40': task.type === 'shopping' && task.status === 'pending',
              'bg-zinc-500/60': task.type === 'other' && task.status === 'pending',

              }"
          >
            <!-- Task Data -->
            <div class="text-gray-900 dark:text-gray-100 "
                 [class.line-through]="task.status === 'completed'">
              {{ task.data }}
            </div>

            <!-- toggle buttons -->
            <div class="flex items-end
            text-gray-800 dark:text-gray-300 truncate text-xs ">
              {{ task.createdAt | timeAgo }}
            </div>
            <button (click)="deleteTask(task.id)"
                    [appTooltip]="'Delete'" [tooltipfadeDuration]="0" [tooltipAutoDismiss]="0"
                    [tooltipCssClass]="'bg-red-500 text-white'"
                    class="hidden group-hover:block absolute  right-2 top-2 px-2 py-1 text-xs rounded bg-black/50  text-white
                               hover:bg-red-600">
              <fa-icon [icon]="faTrash"></fa-icon>
            </button>
          </div>

          <div class="flex items-center flex-row-reverse  justify-center space-x-2 w-auto px-2">

            <ng-container [ngSwitch]="task.status">

              <button *ngSwitchCase="'pending'"
                      (click)="updateTaskStatus(task, 'completed')"
                      class="px-2 py-1 text-xs rounded bg-green-500/50  text-white
                               hover:bg-green-600" [appTooltip]="'Mark Complete'" [tooltipfadeDuration]="0"
                      [tooltipAutoDismiss]="0" [tooltipCssClass]="'bg-green-600 text-white'">
                <fa-icon [icon]="faCheck"></fa-icon>
              </button>

              <button *ngSwitchCase="'completed'"
                      (click)="updateTaskStatus(task, 'archived')"
                      class="px-2 py-1 text-xs rounded bg-gray-500/50  text-white
                         hover:bg-gray-600" [appTooltip]="'Mark Archive'" [tooltipfadeDuration]="0"
                      [tooltipAutoDismiss]="0" [tooltipCssClass]="'bg-gray-600 text-white'">
                <fa-icon [icon]="faArchive"></fa-icon>
              </button>

              <button *ngSwitchCase="'archived'"
                      (click)="updateTaskStatus(task, 'pending')"
                      class="px-2 py-1 text-xs rounded bg-yellow-500/50 text-white
                         hover:bg-yellow-600" [appTooltip]="'Mark Pending'" [tooltipfadeDuration]="0"
                      [tooltipAutoDismiss]="0" [tooltipCssClass]="'bg-yellow-600 text-white'">
                <fa-icon [icon]="faRedo"></fa-icon>
              </button>

            </ng-container>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
