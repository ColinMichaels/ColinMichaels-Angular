<div class="cli-container">
  <div class="cli-output" [ngClass]="'typing-' + currentMode">
    <pre [innerHTML]="typedText"></pre>
  </div>
  <div class="cli-input">
    <span>&gt;</span>
    <input #input
           [(ngModel)]="userInput"
           (keydown.enter)="handleInput()"
           (keydown.arrowUp)="navigateHistory(1)"
           (keydown.arrowDown)="navigateHistory(-1)"
           (keydown)="triggerClick()" cdkTrapFocus/>
  </div>
</div>
