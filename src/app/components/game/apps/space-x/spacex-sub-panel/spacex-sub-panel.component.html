<!-- space-x.component.html -->
<div class="min-h-screen bg-black text-white font-sans px-6 pt-6 pb-24">
  <ng-container [ngSwitch]="panel">
    <app-spacex-rocket *ngSwitchCase="'rocket'" [rocket]="rocket"></app-spacex-rocket>
    <app-spacex-launchpad *ngSwitchCase="'launchpad'" [launchpad]="launchpad"></app-spacex-launchpad>
    <app-spacex-crew *ngSwitchCase="'crew'" [crew]="crew"></app-spacex-crew>
  </ng-container>
</div>
