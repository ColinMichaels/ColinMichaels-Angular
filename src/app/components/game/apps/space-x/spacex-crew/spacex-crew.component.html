<!-- spacex-crew.component.html -->
<div class="max-w-md mx-auto bg-black text-white p-6 rounded-lg shadow-lg font-sans" *ngIf="crew">
  <div class="flex flex-col items-center">
    <img [src]="crew.image" alt="Crew Member Photo" class="w-32 h-32 rounded-full shadow mb-4 border border-zinc-700"/>
    <h1 class="text-2xl font-bold text-blue-400 mb-1">{{ crew.name }}</h1>
    <p class="text-sm text-gray-400 italic mb-2">{{ crew.agency }}</p>
    <span class="text-sm text-green-400" *ngIf="crew.status === 'active'">Active</span>
    <span class="text-sm text-red-400" *ngIf="crew.status !== 'active'">Inactive</span>
    <a *ngIf="crew.wikipedia" [href]="crew.wikipedia" target="_blank"
       class="text-blue-300 hover:underline mt-2 text-sm">Wikipedia</a>
  </div>

  <div class="mt-6">
    <h2 class="text-lg font-semibold text-white mb-2">Launches</h2>
    <ul class="list-disc list-inside text-sm text-blue-300">
      <li *ngFor="let launchId of crew.launches">Launch ID: {{ launchId }}</li>
    </ul>
  </div>
</div>
