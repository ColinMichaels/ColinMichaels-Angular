<!-- piano.component.html -->
<div class="w-full max-w-4xl mx-auto flex justify-center items-end bg-black p-1">
  <div
    *ngFor="let key of buildKeys(octave,2)"
    #pianoKey
    [ngClass]="{
    'bg-white text-black': !key.sharp && !pressedKeys.has(key.note),
    'bg-black text-white': key.sharp && !pressedKeys.has(key.note),
    'bg-blue-200': !key.sharp && pressedKeys.has(key.note),
    'bg-blue-500': key.sharp && pressedKeys.has(key.note)
  }"
    class="relative h-40 w-10 m-[1px] border border-zinc-600 cursor-pointer select-none"
    (mousedown)="onKeyDown(key.note)"
    (mouseenter)="onKeyEnter(key.note)"
    (mouseup)="onKeyUp()"
    [attr.data-note]="key.note"
  >
      <span
        class="absolute bottom-2 left-1/2 transform -translate-x-1/2 text-xs font-mono opacity-30 pointer-events-none"
        [class.bottom-10]="key.sharp"
        [ngClass]="{ 'opacity-100 text-blue-600 font-bold': pressedKeys.has(key.note) }"
      >
        {{ key.note }}
  </span>
  </div>
</div>
