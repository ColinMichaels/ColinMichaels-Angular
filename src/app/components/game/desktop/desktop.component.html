<app-notification-server/>
<div class="min-h-screen w-full bg-white/10">
  <app-system-tray />
  <app-intro-overlay *ngIf="showIntro;" (begin)="onBeginInvestigation()"></app-intro-overlay>
  <app-image-overlay />
  <app-level-loader
    (loaded)="onLevelLoaded($event)"
    (failed)="onLevelLoadFailed($event)"
  ></app-level-loader>

  <div class="flex flex-col items-center justify-center space-y-4 fixed bottom-14 right-5 z-50 text-white">
    <button class="mac-button" (click)="clearUser()">Clear Player Memory</button>
    <button class="mac-button" (click)="sendNotification()">Test Notifications</button>
  </div>


  <ng-container *ngFor="let term of terminalManager.openTerminals">
    <app-terminal-window
      [id]="term.id"
      [title]="term.title"
      [embeddedComponent]="term.component"
      [autoFit]="term.autofit"
    ></app-terminal-window>
  </ng-container>
</div>
