<div class="fixed top-8 right-4 z-[1000] space-y-2 pointer-events-none ">
  <div
    *ngFor="let n of notifications"
    [class]="n.classList ?? 'bg-zinc-700/95 text-white'"
    class="group relative flex items-start max-w-sm w-full p-2 rounded-xl  shadow-2xl
    border border-white/10
     hover:bg-zinc-900  transition-all transform-gpu duration-150 ease-in-out animate-slide-in pointer-events-auto"
  >
    <div #clearAllBtn class="absolute -top-2 -left-2 text-xs text-zinc-400
     rounded-2xl hover:text-white bg-zinc-700 hidden py-1 px-2 cursor-pointer z-50"
         (click)="notifications.length > 1 ? clearAllWithEffect() : null">
      Clear All
    </div>
    <div
      (click)="dismiss(n.id)"
      (mouseenter)="clearAllBtn.classList.remove('hidden')"
      class="close absolute -top-2 -left-2
       hidden group-hover:flex hover:hidden w-full"
    >
      <div class="w-4 h-4 flex items-center justify-center rounded-full text-zinc-400 hover:text-white bg-zinc-700">
        <fa-icon [icon]="faTimes" class="text-xs"></fa-icon>
      </div>

    </div>
    <div
      class="w-8 h-8 rounded-md hover:bg-zinc-700 flex items-center justify-center shadow-lg hover:shadow-inner border-white/10"
      [ngClass]="{'bg-teal-500/30': n.type === 'info', 'bg-yellow-500/30': n.type === 'warning', 'bg-green-500/30': n.type === 'success'}">
      <app-media [media]="n.media"/>
    </div>

    <div class="flex-1 w-full overflow-hidden space-x-1 px-2">
      <div class="font-semibold text-xs truncate w-full block">{{ n.title }}</div>
      <div class="text-xs text-zinc-300 leading-snug line-clamp-2" [innerHTML]="n.message"></div>
    </div>
    <div class="flex align-top text-[8px] font-light">
      <div class="text-zinc-400">{{ n.timestamp | timeAgo }}</div>
    </div>

  </div>
</div>
