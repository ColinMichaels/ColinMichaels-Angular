<!-- terminal-window.component.html -->
<div *ngIf="isVisible && !isMinimized" #terminal class="fixed top-10 left-10 w-[600px] max-w-full shadow-lg rounded-md border border-gray-700 bg-[#1e1e1e]">
  <!-- Title Bar -->
  <div #header class="flex items-center justify-between px-3 py-1.5 bg-[#2e2e2e] rounded-t-md cursor-move select-none">
    <div class="flex space-x-2">
      <div class="w-3 h-3 bg-red-500 rounded-full cursor-pointer" (click)="closeWindow()"></div>
      <div class="w-3 h-3 bg-yellow-400 rounded-full cursor-pointer" (click)="collapseWindow()"></div>
      <div class="w-3 h-3 bg-green-500 rounded-full cursor-pointer" (click)="minimizeToDock()"></div>
    </div>
    <div class="text-sm text-gray-300 font-medium truncate">{{ title }}</div>
    <div class="w-12"></div>
  </div>

  <!-- CLI Content Area -->
  <div class="overflow-y-auto" [class.h-0]="isCollapsed" [class.h-[400px]]="!isCollapsed">
    <ng-container #terminalContent></ng-container>
  </div>

  <!-- Resize Handle -->
  <div #resizeHandle class="absolute bottom-0 right-0 w-4 h-4 bg-transparent cursor-nwse-resize"></div>
</div>

<!-- Dock Icon -->
<div *ngIf="isMinimized" #dock class="fixed bottom-4 left-10 cursor-pointer" (click)="restoreFromDock()">
  <div class="w-12 h-12 bg-[#1e1e1e] border border-gray-600 rounded-md shadow-md flex items-center justify-center">
    <span class="text-green-400 font-mono text-sm">CLI</span>
  </div>
</div>
