<div class="flex flex-col items-center justify-center h-screen  space-y-2 overflow-hidden pointer-events-none">

  <div>
    <ng-container>
      <app-window-header [title]="''"></app-window-header>
    </ng-container>
    <div class="bg-black text-green-500
    shadow-xl shadow-black/20
    rounded-b-xl p-2 sm:p-4 md:px-10 text-sm font-mono space-y-4">
      <div class="relative mt-4 text-center flex flex-col justify-center items-center flex-shrink">
        <h1 class="text-8xl text-red-600 font-extrabold -translate-y-5">404</h1>
        <h1 class="absolute -top-2 left-1/3 text-8xl text-red-500 font-extrabold animate animate-ping blur-md">404</h1>
        <h2 class="text-zinc-500 text-2xl">NOT FOUND</h2>
      </div>
      <div>
        <h3 class="text-zinc-500">OOPSIES!</h3>
        <p class="text-xs">The page you are looking for does not exist.<br>
          You may have mistyped the address or the page may have moved.</p>
      </div>
    </div>

  </div>


  <div class="py-4">
    <button routerLink="/" class="home-button pointer-events-auto">Try Again</button>
  </div>
</div>
